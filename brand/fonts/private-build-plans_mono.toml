[buildPlans.AFW-Iosevka]
family = "AFW Iosevka"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

  [buildPlans.AFW-Iosevka.variants]
  inherits = "ss14"

    [buildPlans.AFW-Iosevka.variants.design]
    one = "no-base"
    two = "curly-neck-serifless"
    three = "two-arcs"
    four = "closed-serifless"
    five = "upright-arched-serifless"
    six = "closed-contour"
    seven = "straight-serifless"
    eight = "two-circles"
    nine = "closed-contour"
    zero = "slashed"
    capital-g = "toothed-serifless-hooked"
    capital-j = "serifless"
    capital-k = "straight-serifless"
    capital-m = "flat-bottom-serifless"
    capital-q = "crossing"
    a = "double-storey-serifless"
    f = "serifless"
    g = "single-storey-serifless"
    j = "narrow-serifed"
    k = "straight-serifless"
    l = "serifed"
    t = "bent-hook"
    ampersand = "closed"
    at = "fourfold"
    dollar = "open"
    cent = "open"
    question = "smooth"

[buildPlans.AFW-Iosevka.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.AFW-Iosevka.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.AFW-Iosevka.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"