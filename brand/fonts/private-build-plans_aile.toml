[buildPlans.AFW-IosevkaAile]
family = "AFW Iosevka Aile"
spacing = "quasi-proportional"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

  [buildPlans.AFW-IosevkaAile.variants]
  inherits = "ss14"

    [buildPlans.AFW-IosevkaAile.variants.design]
    one = "no-base"
    two = "curly-neck-serifless"
    three = "two-arcs"
    four = "closed-serifless"
    five = "upright-arched-serifless"
    six = "closed-contour"
    seven = "straight-serifless"
    eight = "two-circles"
    nine = "closed-contour"
    zero = "slashed"
    capital-g = "toothed-serifless-hooked"
    capital-j = "serifless"
    capital-k = "straight-serifless"
    capital-m = "flat-bottom-serifless"
    capital-q = "crossing"
    a = "double-storey-serifless"
    f = "serifless"
    g = "single-storey-serifless"
    j = "narrow-serifed"
    k = "straight-serifless"
    l = "serifed"
    t = "bent-hook"
    ampersand = "closed"
    at = "fourfold"
    dollar = "open"
    cent = "open"
    question = "smooth"

[buildPlans.AFW-IosevkaAile.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.AFW-IosevkaAile.weights.Heavy]
shape = 900
menu = 900
css = 900

[buildPlans.AFW-IosevkaAile.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.AFW-IosevkaAile.widths.Extended]
shape = 600
menu = 7
css = "expanded"

[buildPlans.AFW-IosevkaAile.widths.SemiExtended]
shape = 548
menu = 6
css = "semi-expanded"

[buildPlans.AFW-IosevkaAile.widths.ExtraExtended]
shape = 658
menu = 8
css = "extra-expanded"

[buildPlans.AFW-IosevkaAile.widths.UltraExtended]
shape = 720
menu = 9
css = "ultra-expanded"

[buildPlans.AFW-IosevkaAile.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"